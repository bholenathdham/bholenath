<circle cx="260" cy="198" r="63" fill="none" stroke="#c99542" stroke-opacity=".3"/>
<text x="260" y="191" text-anchor="middle" fill="#5a2411" font-family="Georgia,'Noto Serif Devanagari',serif" font-size="31">ॐ नमः</text>
