 <circle cx="127" cy="116" r="10"/><circle cx="108" cy="143" r="10"/><circle cx="99" cy="175" r="10"/><circle cx="100" cy="210" r="10"/><circle cx="109" cy="244" r="10"/><circle cx="128" cy="273" r="10"/><circle cx="155" cy="298" r="10"/><circle cx="187" cy="317" r="10"/><circle cx="222" cy="326" r="10"/><circle cx="258" cy="328" r="10"/><circle cx="294" cy="323" r="10"/><circle cx="328" cy="310" r="10"/><circle cx="354" cy="286" r="10"/><circle cx="373" cy="256" r="10"/><circle cx="381" cy="222" r="10"/><circle cx="378" cy="187" r="10"/><circle cx="367" cy="154" r="10"/><circle cx="348" cy="129" r="10"/><circle cx="322" cy="110" r="10"/><circle cx="294" cy="99" r="10"/>
