 <linearGradient id="bead" x1="0" x2="1"><stop stop-color="#6a2818"/><stop offset=".5" stop-color="#a65425"/><stop offset="1" stop-color="#552014"/></linearGradient>
</defs>
<rect x="8" y="8" width="504" height="404" rx="26" fill="url(#bg)" stroke="#b98536" stroke-width="2"/>
