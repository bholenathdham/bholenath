<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-labelledby="t d">
<title id="t">Nama Japa devotional illustration</title><desc id="d">An original vector devotional illustration of a rudraksha mala, trident and crescent moon for mantra practice.</desc>
